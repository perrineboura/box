var colors=["#e84a7f","#f5a623","#3fb6a8","#7b61ff","#4a90e2","#e8604a"];
var AC=window.AudioContext||window.webkitAudioContext;
var ctx=new AC({latencyHint:"interactive"});
var buffers=[],current=[],ready=false;
var msg=document.getElementById("msg");
function b64(s){var r=atob(s.split(",")[1]),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a.buffer}
function decode(ab){return new Promise(function(ok,ko){var p=ctx.decodeAudioData(ab,ok,ko);if(p&&p.catch)p.catch(ko)})}
Promise.all(DATA.map(function(d,i){return decode(b64(d.src)).then(function(b){buffers[i]=b})}))
 .then(function(){ready=true;msg.textContent=""})
 .catch(function(){msg.textContent="Erreur de chargement des sons"});
var unlocked=false;
function unlock(){
  if(ctx.state!=="running")ctx.resume();
  if(!unlocked){unlocked=true;var u=document.getElementById("unlock");u.volume=0.01;var r=u.play();if(r&&r.catch)r.catch(function(){})}
}
function play(i,btn){
  unlock();
  if(!ready||!buffers[i])return;
  if(current[i]){try{current[i].stop()}catch(e){}}
  var s=ctx.createBufferSource();s.buffer=buffers[i];s.connect(ctx.destination);
  s.onended=function(){if(current[i]===s){current[i]=null;btn.classList.remove("on")}};
  current[i]=s;s.start(0);
  btn.classList.add("on");
}
var grid=document.getElementById("grid");
DATA.forEach(function(d,i){
  var b=document.createElement("button");
  b.textContent=d.label;b.style.background=colors[i%colors.length];
  b.addEventListener("pointerdown",function(e){e.preventDefault();play(i,b)});
  b.addEventListener("contextmenu",function(e){e.preventDefault()});
  grid.appendChild(b);
});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&ctx.state!=="running")ctx.resume()});
